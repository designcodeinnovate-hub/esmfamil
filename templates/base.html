<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f4c542">

  <!-- ===== PWA & Icons ===== -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png">
  <link rel="shortcut icon" href="/static/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/static/icons/icon-167.png">

  <!-- iOS PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="اسم فامیل">

  <title>{% block title %}اسم فامیل آنلاین{% endblock %}</title>
  <style>
    :root {
      --bg: #0a0a15;
      --bg-2: #12121f;
      --card: #1a1a2e;
      --card-2: #22223a;
      --border: rgba(148,163,184,0.1);
      --gold: #f4c542;
      --gold-2: #eab308;
      --purple: #8b5cf6;
      --teal: #06b6d4;
      --green: #22c55e;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --dim: #64748b;
      --nav-bg: rgba(10, 10, 21, 0.96);
    }
    [data-theme="light"] {
      --bg: #f5f7fb;
      --bg-2: #ffffff;
      --card: #ffffff;
      --card-2: #f0f2f8;
      --border: rgba(0,0,0,0.08);
      --text: #0f172a;
      --muted: #475569;
      --dim: #64748b;
      --nav-bg: rgba(255, 255, 255, 0.98);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: Tahoma, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 92px;
      padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px) + 20px);
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }
    /* اندازه فونت */
    html.font-small body { font-size: 13px; }
    html.font-medium body { font-size: 15px; }
    html.font-large body { font-size: 17px; }
    
    /* قطع انیمیشن */
    html.no-animations * {
      animation: none !important;
      transition: none !important;
    }
    
    .bg-glow {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      filter: blur(130px);
      z-index: 0;
      pointer-events: none;
    }
    .bg-glow-1 { top: -200px; right: -150px; background: #8b5cf6; opacity: 0.22; }
    .bg-glow-2 { bottom: -200px; left: -150px; background: #f4c542; opacity: 0.12; }
    [data-theme="light"] .bg-glow-1 { opacity: 0.15; }
    [data-theme="light"] .bg-glow-2 { opacity: 0.1; }
    .flash-messages { margin-bottom: 14px; }
    .flash-msg {
      padding: 12px 16px; border-radius: 12px; margin-bottom: 8px;
      font-size: 13px; text-align: right; line-height: 1.6;
    }
    .flash-success { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .flash-error   { background: rgba(239,68,68,0.15);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
    .flash-info    { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .flash-warning { background: rgba(234,179,8,0.15);  color: #fde68a; border: 1px solid rgba(234,179,8,0.35); }
    /* ===== Page loader ===== */
    .page-loader { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, #f4c542, #8b5cf6, #06b6d4); z-index: 9999; transition: width 0.3s ease-out, opacity 0.3s; box-shadow: 0 0 12px rgba(244,197,66,0.6); pointer-events: none; }
    .page-loader.loading {
      width: 85%;
      transition: width 3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .container {
      position: relative;
      animation: pageFadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 16px 20px;
    }
    a { color: inherit; }
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .bottom-nav a { transition: color 0.2s, transform 0.15s; }
    .bottom-nav a .nav-icon { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .bottom-nav a.active .nav-icon { animation: navPulse 0.4s ease-out; }
    @keyframes navPulse {
      0%   { transform: scale(1) translateY(0); }
      50%  { transform: scale(1.2) translateY(-3px); }
      100% { transform: scale(1.12) translateY(-1px); }
    }
    .bottom-nav a:active { transform: scale(0.92); }
    .bottom-nav a.active::before {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      height: calc(72px + env(safe-area-inset-bottom, 0px));
      background: var(--nav-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
      padding-bottom: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .bottom-nav a {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      color: var(--dim);
      font-size: 10.5px;
      padding: 8px 4px;
      height: 72px;
      transition: color 0.15s;
      position: relative;
    }
    .bottom-nav a .nav-icon {
      font-size: 22px;
      filter: grayscale(1);
      opacity: 0.55;
      transition: all 0.2s;
    }
    .bottom-nav a.active { color: var(--gold); }
    .bottom-nav a.active .nav-icon {
      filter: none;
      opacity: 1;
      transform: scale(1.12) translateY(-1px);
      animation: navBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    @keyframes navBounce {
      0%   { transform: scale(1) translateY(0); }
      40%  { transform: scale(1.28) translateY(-7px); }
      70%  { transform: scale(0.92) translateY(2px); }
      100% { transform: scale(1.12) translateY(-1px); }
    }
    .bottom-nav a.active::before {
      content: "";
      position: absolute;
      top: 0; left: 30%; right: 30%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 0 0 4px 4px;
      animation: activeSlide 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(244,197,66,0.6);
    }
    @keyframes activeSlide {
      from { left: 50%; right: 50%; opacity: 0; }
      to   { left: 30%; right: 30%; opacity: 1; }
    }
    .bottom-nav a:active { transform: scale(0.95); }

    /* ===== دکمه بازگشت زیبا ===== */
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(244,197,66,0.15), rgba(139,92,246,0.08));
      border: 1.5px solid rgba(244,197,66,0.35);
      color: var(--gold);
      font-size: 22px;
      text-decoration: none;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
    }
    .back-btn:hover {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(244,197,66,0.4), 0 6px 20px rgba(0,0,0,0.35);
      transform: translateX(-3px);
    }
    .back-btn .arrow-icon {
      display: inline-block;
      transition: transform 0.3s;
    }
    .back-btn:hover .arrow-icon {
      animation: shakeArrow 0.4s infinite;
    }
    .back-btn:active { transform: translateX(-3px) scale(0.92); }
    @keyframes shakeArrow {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-4px); }
    }
  

    /* ============================================================
       SAFETY OVERRIDES — ensure nav is always clickable
       ============================================================ */
    .bottom-nav {
      z-index: 9999 !important;
      pointer-events: auto !important;
    }
    .bottom-nav a,
    .bottom-nav a * {
      pointer-events: auto !important;
      cursor: pointer !important;
    }
    .bottom-nav a {
      -webkit-tap-highlight-color: rgba(244,197,66,0.3);
    }
    
    /* Ensure pageLoader never blocks clicks */
    .page-loader { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, #f4c542, #8b5cf6, #06b6d4); z-index: 9999; transition: width 0.3s ease-out, opacity 0.3s; box-shadow: 0 0 12px rgba(244,197,66,0.6); pointer-events: none; }
    
    /* Ensure audio element is hidden */
    #globalMusic {
      display: none !important;
    }
    
    /* Ensure any pwa banner sits above nav but doesn't block */
    #pwaBanner, #musicHint, .pwa-install-banner {
      pointer-events: auto;
    }
</style>
  {% block extra_css %}{% endblock %}
</head>
<body>

<div class="page-loader" id="pageLoader"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="container">
{% if messages %}
<div class="flash-messages">
  {% for m in messages %}
    <div class="flash-msg flash-{{ m.tags }}">{{ m }}</div>
  {% endfor %}
</div>

{% block content %}{% endblock %}
</div>

<!-- آهنگ پس‌زمینه -->
<audio id="globalMusic" loop preload="auto">
  <source src="/static/audio/nature.mp3" type="audio/mpeg">
</audio>

<script>
// ============================================================
// ۱) اعمال تنظیمات ذخیره شده در هنگام بارگذاری هر صفحه
// ============================================================
(function applySettings() {
  // حالت تاریک/روشن
  const theme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.body.setAttribute('data-theme', theme);
  
  // اندازه فونت
  const fontSize = localStorage.getItem('fontSize') || 'medium';
  document.documentElement.classList.remove('font-small', 'font-medium', 'font-large');
  document.documentElement.classList.add('font-' + fontSize);
  
  // قطع انیمیشن‌ها
  const animOn = localStorage.getItem('animations') !== 'false';
  if (!animOn) {
    document.documentElement.classList.add('no-animations');
  } else {
    document.documentElement.classList.remove('no-animations');
  }
})();

// ============================================================
// ۲) موسیقی و افکت‌های صوتی
// ============================================================
const _soundOn = () => localStorage.getItem('sound') !== 'false';
const _musicOn = () => localStorage.getItem('music') !== 'false';
const _soundVol = () => (parseInt(localStorage.getItem('soundVol')) || 80) / 100;
const _musicVol = () => (parseInt(localStorage.getItem('musicVol')) || 50) / 100;
const _vibOn = () => localStorage.getItem('vibration') !== 'false';

let _audioCtx = null;
function _getCtx() {
  if (!_audioCtx) {
    try { _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return null; }
  }
  return _audioCtx;
}

function playBeep(freq = 1000, duration = 0.05, type = 'sine') {
  if (!_soundOn()) return;
  const vol = _soundVol();
  if (vol <= 0) return;
  try {
    const ctx = _getCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol * 0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

// صداهای از پیش تعریف شده
window.soundClick = () => playBeep(1200, 0.04);
window.soundTab = () => playBeep(900, 0.05);
window.soundSuccess = () => { playBeep(880, 0.08); setTimeout(() => playBeep(1320, 0.1), 80); };
window.soundError = () => playBeep(300, 0.15, 'square');
window.soundTick = (urgent) => playBeep(urgent ? 1000 : 800, 0.06);
window.soundBack = () => { playBeep(600, 0.05); setTimeout(() => playBeep(400, 0.06), 50); };

window.vibrate = (ms = 50) => {
  if (_vibOn() && navigator.vibrate) navigator.vibrate(ms);
};

// صدا روی کلیک هر عنصر
document.addEventListener('click', (e) => {
  const target = e.target.closest('a, button, .mode-card, .menu-item, .pill, .cat-tag, .back-btn');
  if (target) {
    if (target.classList.contains('back-btn')) {
      window.soundBack();
    } else {
      window.soundClick();
    }
  }
}, true);

// ============================================================
// ROBUST MUSIC SYSTEM (v3)
// ============================================================




// ============================================================
// 🎵 MUSIC v5 — persistent across pages, auto-start
// ============================================================
(function() {
  const audio = document.getElementById('globalMusic');
  if (!audio) { console.warn('[Music] no audio element'); return; }

  audio.loop = true;
  audio.preload = 'auto';

  const MIN_START = 3;
  const KEY_POS = 'bgMusicPosV5';
  const KEY_VOL = 'musicVol';
  const KEY_ON = 'music';
  const KEY_UNLOCK = 'bgMusicUnlockedV5';

  const isOn = () => localStorage.getItem(KEY_ON) !== 'false';
  const getVol = () => (parseInt(localStorage.getItem(KEY_VOL)) || 50) / 100;
  const wasUnlocked = () => localStorage.getItem(KEY_UNLOCK) === '1';

  // Detect gameplay pages (music pauses there)
  const path = window.location.pathname;
  const isGameplay = /^\/game\/(quick\/bot\/play|quick\/bot\/submit|team\/play|team\/round-end|room\/|match\/wait)/.test(path);

  // Save position frequently
  let lastSaved = 0;
  function save() {
    if (!audio.paused && audio.currentTime > 0) {
      try { localStorage.setItem(KEY_POS, audio.currentTime.toFixed(2)); } catch(e) {}
    }
  }

  audio.addEventListener('timeupdate', () => {
    const now = Date.now();
    if (now - lastSaved > 200) {
      save();
      lastSaved = now;
    }
  });
  audio.addEventListener('pause', save);
  window.addEventListener('beforeunload', save);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') save();
  });

  // Restore position
  function restorePosition() {
    try {
      const saved = parseFloat(localStorage.getItem(KEY_POS) || '0');
      if (isNaN(saved) || saved <= 0) {
        audio.currentTime = MIN_START;
        return;
      }
      const dur = audio.duration;
      if (dur && saved >= dur - 1) {
        audio.currentTime = MIN_START;
      } else {
        audio.currentTime = saved;
      }
    } catch(e) {
      try { audio.currentTime = MIN_START; } catch(e2) {}
    }
  }

  if (audio.readyState >= 1) restorePosition();
  else audio.addEventListener('loadedmetadata', restorePosition, { once: true });

  // If gameplay, don't play music
  if (isGameplay) {
    audio.muted = true;
    audio.pause();
    // Expose control so game pages can resume on exit
    window.__music = {
      element: audio,
      isGameplay: true,
      pause: () => audio.pause(),
      resume: () => { if (isOn()) { audio.muted = false; audio.volume = getVol(); audio.play().catch(()=>{}); } },
    };
    return;
  }

  // Set volume
  audio.volume = getVol();

  // If previously unlocked, try playing with sound immediately
  if (wasUnlocked()) {
    audio.muted = false;
    const p = audio.play();
    if (p) p.catch(() => {
      // Even unlocked state failed - fall back to muted
      audio.muted = true;
      audio.play().catch(()=>{});
      attachUnlock();
    });
  } else {
    // Try muted autoplay
    audio.muted = true;
    audio.play().then(() => {
      attachUnlock();
    }).catch(() => {
      attachUnlock();
    });
  }

  // Attach unlock to ANY user interaction
  function attachUnlock() {
    const events = [
      'pointerdown', 'pointermove', 'pointerup',
      'mousedown', 'mousemove', 'mouseup',
      'touchstart', 'touchmove', 'touchend',
      'keydown', 'keyup', 'keypress',
      'click', 'scroll', 'wheel', 'focus'
    ];

    let done = false;
    const unlock = () => {
      if (done) return;
      done = true;
      if (!isOn()) return;

      audio.muted = false;
      audio.volume = getVol();
      if (audio.paused) {
        audio.play().catch(()=>{});
      }
      try { localStorage.setItem(KEY_UNLOCK, '1'); } catch(e) {}

      events.forEach(ev => {
        document.removeEventListener(ev, unlock, true);
        window.removeEventListener(ev, unlock, true);
      });
    };

    events.forEach(ev => {
      document.addEventListener(ev, unlock, { capture: true, passive: true });
      window.addEventListener(ev, unlock, { capture: true, passive: true });
    });

    // Also try to detect Chrome's "media engagement" — retry play every 2s for 30s
    let retries = 0;
    const retryPlay = setInterval(() => {
      retries++;
      if (audio.paused && isOn() && retries < 15) {
        audio.muted = true;
        audio.play().catch(()=>{});
      } else {
        clearInterval(retryPlay);
      }
    }, 2000);
  }

  // React to settings
  window.addEventListener('storage', (e) => {
    if (e.key === KEY_ON) {
      if (isOn()) {
        audio.muted = false;
        audio.volume = getVol();
        if (audio.paused) audio.play().catch(()=>{});
      } else {
        audio.pause();
      }
    }
    if (e.key === KEY_VOL) {
      audio.volume = getVol();
    }
  });

  // Expose control
  window.__music = {
    element: audio,
    isGameplay: false,
    pause: () => audio.pause(),
    resume: () => {
      if (isOn()) {
        audio.muted = false;
        audio.volume = getVol();
        audio.play().catch(()=>{});
      }
    },
    setVolume: (v) => { audio.volume = v / 100; },
    isPlaying: () => !audio.paused,
  };
})();


window.applySettingsNow = function(key, value) {
  if (key === 'theme') {
    document.documentElement.setAttribute('data-theme', value);
    document.body.setAttribute('data-theme', value);
  }
  if (key === 'fontSize') {
    document.documentElement.classList.remove('font-small', 'font-medium', 'font-large');
    document.documentElement.classList.add('font-' + value);
  }
  if (key === 'animations') {
    if (value === 'false') {
      document.documentElement.classList.add('no-animations');
    } else {
      document.documentElement.classList.remove('no-animations');
    }
  }
  if (key === 'music') {
    if (value === 'true' && window.__music) {
      bgMusic.volume = _musicVol();
      bgMusic.play().catch(() => {});
      _musicStarted = true;
    } else if (window.__music) {
      window.__music.pause();
    }
  }
  if (key === 'musicVol' && window.__music) {
    window.__music.setVolume(parseInt(value) / 100 * 100);
  }
};
</script>
{% block extra_js %}{% endblock %}

<script>
// ============================================================
// Service Worker Registration (PWA)
// ============================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then((reg) => console.log('[SW] registered:', reg.scope))
      .catch((err) => console.warn('[SW] error:', err));
  });
}

// ============================================================
// Install Prompt (PWA)
// ============================================================
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  _deferredInstallPrompt = e;
  // Show install banner if not dismissed before
  if (!localStorage.getItem('installDismissed')) {
    setTimeout(() => {
      const banner = document.getElementById('pwaInstallBanner');
      if (banner) banner.classList.add('show');
    }, 3000);
  }
});

window.addEventListener('appinstalled', () => {
  localStorage.setItem('installDismissed', '1');
  const banner = document.getElementById('pwaInstallBanner');
  if (banner) banner.classList.remove('show');
});

function triggerInstall() {
  if (!_deferredInstallPrompt) return;
  _deferredInstallPrompt.prompt();
  _deferredInstallPrompt.userChoice.then((choice) => {
    if (choice.outcome === 'accepted') {
      localStorage.setItem('installDismissed', '1');
    }
    _deferredInstallPrompt = null;
    const banner = document.getElementById('pwaInstallBanner');
    if (banner) banner.classList.remove('show');
  });
}

function dismissInstall() {
  localStorage.setItem('installDismissed', '1');
  const banner = document.getElementById('pwaInstallBanner');
  if (banner) banner.classList.remove('show');
}
</script>
