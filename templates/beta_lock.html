<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a15">
  <title>🔒 دسترسی محدود</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Tahoma, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 10%, #1e1b4b 0%, #0f0f1e 45%, #060608 100%);
      color: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
      padding: 24px 20px;
    }
    .glow { position: fixed; width: 400px; height: 400px; border-radius: 50%;
      filter: blur(130px); z-index: 0; pointer-events: none; }
    .glow-1 { top: -100px; right: -100px; background: #8b5cf6; opacity: 0.28; }
    .glow-2 { bottom: -100px; left: -100px; background: #f4c542; opacity: 0.18; }
    .box {
      position: relative; z-index: 10;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(244, 197, 66, 0.35);
      padding: 34px 28px;
      border-radius: 24px;
      width: 420px; max-width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .lock-icon { text-align: center; font-size: 72px; margin-bottom: 14px;
      filter: drop-shadow(0 0 30px rgba(244,197,66,0.5)); }
    h1 { font-size: 22px; text-align: center;
      background: linear-gradient(135deg, #f4c542, #f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 8px; font-weight: 900; }
    p.sub { text-align: center; color: #94a3b8; font-size: 13px;
      margin-bottom: 22px; line-height: 1.7; }
    .warning-banner {
      background: rgba(234, 179, 8, 0.12);
      border: 1px solid rgba(234, 179, 8, 0.35);
      border-right: 4px solid #eab308;
      padding: 12px 14px; border-radius: 12px;
      margin-bottom: 20px; font-size: 12px;
      color: #fde68a; line-height: 1.7; text-align: right;
    }
    .warning-banner b { color: #facc15; }
    label { display: block; color: #cbd5e1; font-size: 13px; margin-bottom: 8px; }
    input[type=password] {
      width: 100%; padding: 16px 18px; border-radius: 14px;
      border: 2px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.7);
      color: #fff; font-size: 16px;
      font-family: monospace; letter-spacing: 2px;
      text-align: center;
    }
    input[type=password]:focus {
      outline: none; border-color: #f4c542;
      box-shadow: 0 0 0 4px rgba(244, 197, 66, 0.15);
    }
    .error {
      background: rgba(239, 68, 68, 0.15); color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 12px 16px; border-radius: 12px;
      font-size: 13px; margin-bottom: 14px; text-align: center;
    }
    button {
      width: 100%; margin-top: 22px; padding: 16px;
      border: none; border-radius: 14px;
      font-size: 17px; font-weight: 900;
      font-family: inherit; cursor: pointer;
      color: #1a1a1a;
      background: linear-gradient(135deg, #f4c542, #eab308);
      box-shadow: 0 12px 35px rgba(244, 197, 66, 0.4);
    }
    button:hover { transform: translateY(-2px); }
    .footer-note {
      text-align: center; margin-top: 22px; padding-top: 18px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 11px; color: #64748b; line-height: 1.8;
    }
    .footer-note .brand { color: #f4c542; font-weight: bold; }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="box">
    <div class="lock-icon">🔒</div>
    <h1>دسترسی محدود</h1>
    <p class="sub">این نسخه در حال تست داخلی است.</p>
    <div class="warning-banner">
      <b>⚠️ برنامه آزمایشی</b><br>
      این رمز فقط برای اعضای تیم سازنده است.
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>🔑 رمز دسترسی</label>
      <input type="password" name="password" required autofocus
             placeholder="• • • • • • • •" autocomplete="off">
      <button type="submit">🚀 ورود به برنامه</button>
    </form>
    <div class="footer-note">
      <div class="brand">اسم فامیل آنلاین</div>
      <div>🧪 نسخه آزمایشی — v3.0 beta</div>
    </div>
  </div>
</body>
</html>
