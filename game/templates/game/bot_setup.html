<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بازی با بات</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 80% 0%, #1e1b4b 0%, #0f0f1e 50%, #060608 100%);
      color: #e2e8f0;
      padding: 30px 20px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    a.back { color: #60a5fa; text-decoration: none; font-size: 14px; }
    h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #f97316, #eab308);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 14px 0 6px;
    }
    p.sub { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
    .box {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.12);
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    .box h3 { font-size: 16px; margin-bottom: 14px; color: #fdba74; }
    label.chk { display: block; margin: 6px 0; color: #cbd5e1; font-size: 14px; }
    .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .pill-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .pill {
      flex: 1; min-width: 100px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid rgba(148, 163, 184, 0.2);
      background: rgba(51, 65, 85, 0.4);
      text-align: center;
      cursor: pointer;
      transition: all 0.18s;
      font-size: 14px;
      color: #cbd5e1;
    }
    .pill:hover { border-color: #f97316; }
    .pill input { display: none; }
    .pill:has(input:checked) {
      border-color: #f97316;
      background: linear-gradient(135deg, rgba(249,115,22,0.25), rgba(234,179,8,0.15));
      box-shadow: 0 0 20px rgba(249,115,22,0.35);
      color: #fff;
      font-weight: bold;
    }
    input[type=text] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: #1e293b;
      color: #fff;
      font-size: 18px;
      text-align: center;
      font-family: inherit;
      margin-top: 10px;
    }
    input[type=text]:focus { outline: none; border-color: #f97316; }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #f97316, #eab308);
      box-shadow: 0 10px 30px rgba(249,115,22,0.4);
    }
    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
<div class="container">
  <a class="back" href="/game/">← بازگشت</a>
  <h1>⚡ بازی با بات</h1>
  <p class="sub">سختی و حروف رو انتخاب کن.</p>
  <form method="post">
    {% csrf_token %}
    <div class="box">
      <h3>🎯 سطح سختی بات</h3>
      <div class="pill-row">
        <label class="pill"><input type="radio" name="difficulty" value="easy"><span>😊 آسان</span></label>
        <label class="pill"><input type="radio" name="difficulty" value="medium" checked><span>😐 متوسط</span></label>
        <label class="pill"><input type="radio" name="difficulty" value="hard"><span>😈 سخت</span></label>
      </div>
    </div>
    <div class="box">
      <h3>🔤 حالت انتخاب حرف</h3>
      <div class="pill-row">
        <label class="pill"><input type="radio" name="letter_mode" value="random" checked><span>🎲 تصادفی</span></label>
        <label class="pill"><input type="radio" name="letter_mode" value="player"><span>✍️ خودم</span></label>
      </div>
      <input type="text" name="letter" maxlength="2" placeholder="حرف دلخواه (مثلاً: ب)">
    </div>
    <div class="box">
      <h3>📋 دسته‌ها</h3>
      <div class="cats">
        {% for c in categories %}
          <label class="chk"><input type="checkbox" name="categories" value="{{ c }}" checked> {{ c }}</label>
        {% endfor %}
      </div>
    </div>
    <button type="submit">🚀 شروع بازی</button>
  </form>
</div>
</body>
</html>
