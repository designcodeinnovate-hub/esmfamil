{% extends "base.html" %}
{% block title %}ورود به اتاق{% endblock %}

{% block extra_css %}
<style>
  .box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px 20px; text-align: center; margin-top: 40px; max-width: 400px; margin-left: auto; margin-right: auto; }
  .box h3 { color: var(--gold); font-size: 20px; margin-bottom: 8px; }
  .box p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .lock-icon { font-size: 60px; margin-bottom: 16px; }
  input[type=password] { width: 100%; padding: 16px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg); color: #fff; text-align: center; font-size: 20px; letter-spacing: 4px; box-sizing: border-box; margin-bottom: 16px; }
  input[type=password]:focus { outline: none; border-color: var(--teal); }
  button { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #06b6d4, #3b82f6); color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
  .error { background: rgba(239,68,68,0.15); color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
</style>
{% endblock %}

{% block content %}
  <div class="box">
    <div class="lock-icon">🔒</div>
    <h3>ورود به اتاق {{ room.room_name }}</h3>
    <p>این اتاق رمز دارد. برای ورود رمز را وارد کنید.</p>
    
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    
    <form method="post">
      {% csrf_token %}
      <input type="password" name="password" placeholder="رمز اتاق" required autofocus>
      <button type="submit">ورود به اتاق</button>
    </form>
  </div>
{% endblock %}
