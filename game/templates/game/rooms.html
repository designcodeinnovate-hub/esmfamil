{% extends "base.html" %}
{% block title %}بازی‌ها{% endblock %}

{% block extra_css %}
<style>
  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; font-weight: bold; }
  .page-head h1 span { color: var(--gold); }

  .big-card {
    border-radius: 20px; padding: 24px 22px; margin-bottom: 14px;
    text-decoration: none; color: #fff;
    display: flex; align-items: center; gap: 16px;
    position: relative; overflow: hidden;
    border: 1.5px solid; transition: all 0.22s; cursor: pointer;
  }
  .big-card:hover { transform: translateY(-3px); }
  .big-card:active { transform: scale(0.98); }
  .big-card.bot {
    background: radial-gradient(circle at 100% 0%, rgba(244,197,66,0.25), transparent 60%),
                linear-gradient(135deg, #2a1a0e, #1a0f1a);
    border-color: rgba(244,197,66,0.4);
  }
  .big-card.room {
    background: radial-gradient(circle at 100% 0%, rgba(139,92,246,0.3), transparent 60%),
                linear-gradient(135deg, #1a0f2e, #0f0f1e);
    border-color: rgba(139,92,246,0.4);
  }
  .big-card .bc-icon {
    font-size: 42px; width: 68px; height: 68px;
    border-radius: 18px; background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .big-card .bc-body { flex: 1; }
  .big-card .bc-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #fff; }
  .big-card .bc-desc { font-size: 12.5px; color: #cbd5e1; line-height: 1.5; }
  .big-card .bc-arrow { font-size: 22px; color: #94a3b8; }
</style>
{% endblock %}

{% block content %}
  <div class="page-head">
    <h1>🎮 <span>بازی‌ها</span></h1>
  </div>

  <a href="/game/quick/" class="big-card bot">
    <div class="bc-icon">⚡</div>
    <div class="bc-body">
      <div class="bc-title">بازی با بات</div>
      <div class="bc-desc">رقیب هوشمند، سه سطح سختی</div>
    </div>
    <div class="bc-arrow">←</div>
  </a>

  <a href="/game/rooms/manage/" class="big-card room">
    <div class="bc-icon">🚪</div>
    <div class="bc-body">
      <div class="bc-title">اتاق‌های بازی</div>
      <div class="bc-desc">ساخت اتاق جدید یا پیوستن به دوستان</div>
    </div>
    <div class="bc-arrow">←</div>
  </a>
{% endblock %}
