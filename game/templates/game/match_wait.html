{% extends "base.html" %}
{% block title %}جستجوی حریف{% endblock %}

{% block extra_css %}
<style>
  .wait-box {
    text-align: center; padding: 60px 20px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 24px; margin-top: 40px;
  }
  .spinner {
    width: 90px; height: 90px; margin: 0 auto 26px;
    border: 5px solid rgba(244,197,66,0.2);
    border-top-color: var(--gold);
    border-radius: 50%; animation: spin 1.2s linear infinite;
    position: relative;
  }
  .spinner::after {
    content: "🎯"; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); font-size: 32px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 24px; margin-bottom: 10px;
    background: linear-gradient(135deg, #06b6d4, #3b82f6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p.sub { color: var(--muted); font-size: 14px; line-height: 1.7; margin-bottom: 20px; }
  .count {
    display: inline-block; background: rgba(244,197,66,0.15);
    color: var(--gold); padding: 8px 20px; border-radius: 14px;
    font-size: 15px; font-weight: bold; margin-bottom: 22px;
    border: 1px solid rgba(244,197,66,0.3);
  }
  .cancel-btn {
    display: inline-block; padding: 14px 32px; border-radius: 14px;
    background: rgba(239,68,68,0.15); color: #f87171;
    border: 1px solid rgba(239,68,68,0.35);
    text-decoration: none; font-weight: bold; font-size: 15px;
  }
</style>
{% endblock %}

{% block content %}
  <div class="wait-box">
    <div class="spinner"></div>
    <h1>در حال جستجوی حریف…</h1>
    <p class="sub">کمی صبر کن. وقتی یه نفر پیدا شه،<br>خودکار به اتاق بازی می‌ری.</p>
    <div class="count" id="countBox">در انتظار…</div>
    <br>
    <a href="/game/match/cancel/" class="cancel-btn">✕ لغو</a>
  </div>
{% endblock %}

{% block extra_js %}
<script>
  let checks = 0;
  const interval = setInterval(checkStatus, 2000);

  function checkStatus() {
    checks++;
    if (checks > 60) {
      clearInterval(interval);
      alert('حریفی پیدا نشد. دوباره تلاش کن.');
      window.location.href = '/game/rooms/';
      return;
    }
    fetch('/game/match/status/')
      .then(r => r.json())
      .then(data => {
        if (data.status === 'matched') {
          clearInterval(interval);
          window.location.href = data.url;
        } else if (data.status === 'cancelled') {
          clearInterval(interval);
          window.location.href = '/game/rooms/';
        } else if (data.count) {
          document.getElementById('countBox').textContent = data.count + ' نفر در صف';
        }
      })
      .catch(e => console.log(e));
  }
</script>
{% endblock %}
