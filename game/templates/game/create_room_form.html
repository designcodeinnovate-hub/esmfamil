{% extends "base.html" %}
{% block title %}ساخت اتاق{% endblock %}

{% block extra_css %}
<style>
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .page-head h1 { font-size: 22px; font-weight: bold; }
  .page-head h1 span { color: var(--gold); }
  .box { background: var(--card); border: 1px solid var(--border); padding: 22px; border-radius: 18px; }
  label.lbl { display: block; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  input[type=text] {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 16px; font-family: inherit; margin-bottom: 18px;
  }
  input[type=text]:focus { outline: none; border-color: var(--gold); }
  .cats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .cats-grid label {
    display: flex; align-items: center; gap: 8px;
    font-size: 13.5px; padding: 8px 10px;
    background: var(--bg); border-radius: 10px; cursor: pointer;
  }
  button.submit {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-size: 17px; font-weight: bold; font-family: inherit; cursor: pointer;
    color: #1a1a1a; background: linear-gradient(135deg, #f4c542, #eab308);
    box-shadow: 0 10px 30px rgba(244,197,66,0.4);
  }
</style>
{% endblock %}

{% block content %}
  <div class="page-head">
    <a href="/game/rooms/" class="back-btn"><span class="arrow-icon">→</span></a>
    <h1>🚪 <span>ساخت اتاق</span></h1>
  </div>
  <form method="post" action="/game/create/">
    {% csrf_token %}
    <div class="box">
      <label class="lbl">رمز اتاق (اختیاری)</label>
      <input type="text" name="password" maxlength="32" placeholder="مثلاً 1234">
      <label class="lbl">دسته‌ها</label>
      <div class="cats-grid">
        {% for c in categories %}
          <label><input type="checkbox" name="categories" value="{{ c }}" checked> {{ c }}</label>
        {% endfor %}
      </div>
      <button type="submit" class="submit">🚀 ساخت اتاق</button>
    </div>
  </form>
{% endblock %}
