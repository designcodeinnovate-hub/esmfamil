<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>در حال بازی</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f0f1e 55%, #060608 100%);
      color: #e2e8f0;
      padding: 24px 20px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    .letter-badge {
      text-align: center;
      font-size: 110px;
      font-weight: bold;
      line-height: 1;
      background: linear-gradient(135deg, #f97316, #eab308, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 26px rgba(249,115,22,0.5));
      margin: 10px 0 6px;
    }
    .hint { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 22px; }
    .row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; margin-bottom: 10px; align-items: center; }
    .row .label { color: #cbd5e1; font-size: 15px; }
    input[type=text] {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(30, 41, 59, 0.7);
      color: #fff;
      font-size: 16px;
      font-family: inherit;
    }
    input[type=text]:focus { outline: none; border-color: #f97316; }
    button.stop {
      width: 100%;
      margin-top: 20px;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 20px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 12px 34px rgba(239,68,68,0.45);
    }
    button.stop:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
<div class="container">
  <div class="letter-badge">{{ round.letter }}</div>
  <div class="hint">⏱️ زمان مخفی است — سرعت داشته باش!</div>
  <form method="post" action="/game/quick/bot/submit/{{ game.id }}/" id="form">
    {% csrf_token %}
    {% for c in categories %}
      <div class="row">
        <div class="label">{{ c }}</div>
        <input type="text" name="cat_{{ c }}" autocomplete="off" maxlength="64">
      </div>
    {% endfor %}
    <button type="submit" class="stop">✋ استپ!</button>
  </form>
</div>
<script>
  const total = {{ duration }};
  let left = total;
  const form = document.getElementById('form');
  const t = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(t); form.submit(); }
  }, 1000);
</script>
</body>
</html>
