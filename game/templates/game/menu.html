<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خانه</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 10%, #1e1b4b 0%, #0f0f1e 45%, #060608 100%);
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .glow {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 { top: -180px; left: -180px; background: #f97316; }
    .glow-2 { bottom: -180px; right: -180px; background: #06b6d4; }
    .glow-3 { top: 40%; left: 40%; background: #eab308; opacity: 0.15; }
    .container {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 12px 18px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 17px; }
    .user-avatar {
      font-size: 34px;
      background: linear-gradient(135deg, #f97316, #eab308);
      width: 52px; height: 52px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
    }
    .user-name { font-weight: bold; color: #fff; }
    .actions { display: flex; gap: 8px; }
    .actions a {
      color: #cbd5e1; text-decoration: none; font-size: 13px;
      padding: 8px 14px; border-radius: 10px;
      background: rgba(51, 65, 85, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
    }
    .welcome { text-align: center; margin: 44px 0 36px; }
    .welcome h1 {
      font-size: 30px;
      background: linear-gradient(135deg, #f97316, #eab308, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .welcome p { color: #94a3b8; font-size: 15px; }
    .menu-rows {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 560px;
      margin: 0 auto;
    }
    .row-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 24px;
      border-radius: 18px;
      text-decoration: none;
      color: #fff;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.12);
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }
    .row-card::before {
      content: "";
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 6px;
    }
    .row-quick::before   { background: linear-gradient(#f97316, #eab308); }
    .row-friends::before { background: linear-gradient(#06b6d4, #3b82f6); }
    .row-rooms::before   { background: linear-gradient(#eab308, #f97316); }
    .row-icon { font-size: 42px; flex-shrink: 0; }
    .row-text { flex: 1; }
    .row-title { font-size: 19px; font-weight: bold; margin-bottom: 4px; }
    .row-desc { font-size: 13px; color: #94a3b8; }
    .row-arrow { font-size: 22px; color: #64748b; }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="container">
    <div class="topbar">
      <div class="user-info">
        <div class="user-avatar">{{ avatar_emoji }}</div>
        <span class="user-name">{{ user.alias }}</span>
      </div>
      <div class="actions">
        <a href="/accounts/profile/">👤 پروفایل</a>
        <a href="/accounts/logout/">🚪 خروج</a>
      </div>
    </div>

    <div class="welcome">
      <h1>🎮 چیکار کنیم {{ user.alias }}؟</h1>
      <p>یکی رو انتخاب کن و بریم!</p>
    </div>

    <div class="menu-rows">
      <a class="row-card row-quick" href="/game/quick/">
        <div class="row-icon">⚡</div>
        <div class="row-text">
          <div class="row-title">بازی سریع با بات</div>
          <div class="row-desc">یه رقیب هوشمند، سه سطح سختی</div>
        </div>
        <div class="row-arrow">←</div>
      </a>
      <a class="row-card row-friends" href="/game/friends/">
        <div class="row-icon">👥</div>
        <div class="row-text">
          <div class="row-title">دوستان</div>
          <div class="row-desc">لیست دوستان و چت</div>
        </div>
        <div class="row-arrow">←</div>
      </a>
      <a class="row-card row-rooms" href="/game/rooms/">
        <div class="row-icon">🚪</div>
        <div class="row-text">
          <div class="row-title">اتاق‌ها</div>
          <div class="row-desc">ساخت اتاق یا ورود با کد</div>
        </div>
        <div class="row-arrow">←</div>
      </a>
    </div>
  </div>
</body>
</html>
