<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>چت با {{ other.alias }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f0f1e 55%, #060608 100%);
      color: #e2e8f0;
      padding: 24px 20px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    a.back { color: #60a5fa; text-decoration: none; font-size: 14px; }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      margin: 14px 0;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 16px;
    }
    .chat-head .av {
      width: 54px; height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(6,182,212,0.35), rgba(59,130,246,0.25));
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }
    .chat-head .info { flex: 1; }
    .chat-head .name { font-size: 18px; font-weight: bold; }
    .chat-head .sub { font-size: 12px; color: #64748b; font-family: monospace; }

    .chat-body {
      height: 400px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
      text-align: center;
      margin-bottom: 16px;
    }
    .chat-body .icon { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.5; }

    .chat-input {
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
    }
    .chat-input button {
      padding: 14px 22px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      cursor: not-allowed;
      opacity: 0.5;
    }
  </style>
</head>
<body>
<div class="container">
  <a class="back" href="/social/">← بازگشت</a>

  <div class="chat-head">
    <div class="av">{{ other_avatar }}</div>
    <div class="info">
      <div class="name">{{ other.alias }}</div>
      <div class="sub">#{{ other.public_id }}</div>
    </div>
  </div>

  <div class="chat-body">
    <div>
      <span class="icon">💬</span>
      چت به‌زودی فعال می‌شود.<br>
      در نسخه بعدی می‌توانی پیام بفرستی.
    </div>
  </div>

  <div class="chat-input">
    <input type="text" placeholder="پیامت را بنویس..." disabled>
    <button disabled>ارسال</button>
  </div>
</div>
</body>
</html>
