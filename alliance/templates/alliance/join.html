<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود به اتحاد</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 30% 10%, #1e1b4b 0%, #0f0f1e 45%, #060608 100%);
      color: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
      padding: 24px 20px;
    }
    .box {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 32px 28px;
      border-radius: 22px;
      width: 400px;
      max-width: 100%;
    }
    a.back { color: #60a5fa; text-decoration: none; font-size: 14px; display: block; margin-bottom: 12px; }
    h1 { font-size: 24px; color: #facc15; margin-bottom: 8px; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

    .error { background: rgba(239, 68, 68, 0.15); color: #f87171;
             border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 14px;
             border-radius: 10px; margin-bottom: 14px; font-size: 14px; }

    label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 2px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      font-size: 22px;
      font-family: monospace;
      text-align: center;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    input:focus { outline: none; border-color: #06b6d4; }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      box-shadow: 0 10px 30px rgba(6,182,212,0.4);
    }
  </style>
</head>
<body>
<div class="box">
  <a class="back" href="/alliance/">← بازگشت</a>
  <h1>🔑 ورود با کد</h1>
  <p class="sub">کد ۶ حرفی اتحاد رو وارد کن.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post">
    {% csrf_token %}
    <label>کد دعوت</label>
    <input type="text" name="code" maxlength="6" required autofocus placeholder="ABC123">
    <button type="submit">🚀 پیوستن</button>
  </form>
</div>
</body>
</html>
