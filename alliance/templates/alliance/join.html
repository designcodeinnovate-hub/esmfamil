{% extends "base.html" %}
{% block title %}ورود به اتحاد{% endblock %}

{% block extra_css %}
<style>
  .page-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .page-head h1 { font-size: 22px; font-weight: bold; }
  .page-head h1 span { color: var(--gold); }

  p.sub { color: var(--muted); font-size: 13.5px; margin-bottom: 22px; text-align: center; }

  .error {
    background: rgba(239, 68, 68, 0.15); color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.35);
    padding: 12px 16px; border-radius: 12px;
    margin-bottom: 14px; font-size: 13.5px; text-align: center;
  }

  .box {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 28px 22px; border-radius: 20px;
  }

  label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 8px; text-align: center; }
  input {
    width: 100%; padding: 18px; border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--bg); color: var(--text);
    font-size: 26px; font-family: monospace;
    text-align: center; letter-spacing: 8px;
    text-transform: uppercase;
  }
  input:focus { outline: none; border-color: var(--teal); }

  button {
    width: 100%; margin-top: 20px; padding: 16px;
    border: none; border-radius: 14px;
    font-size: 17px; font-weight: bold;
    font-family: inherit; cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #06b6d4, #3b82f6);
    box-shadow: 0 10px 30px rgba(6,182,212,0.4);
  }
</style>
{% endblock %}

{% block content %}

  <div class="page-head">
    <a href="/alliance/" class="back-btn"><span class="arrow-icon">→</span></a>
    <h1>🔑 <span>ورود با کد</span></h1>
  </div>

  <p class="sub">کد ۶ حرفی اتحاد رو وارد کن.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <div class="box">
    <form method="post">
      {% csrf_token %}
      <label>کد دعوت</label>
      <input type="text" name="code" maxlength="6" required autofocus placeholder="ABC123" autocomplete="off">
      <button type="submit">🚀 پیوستن</button>
    </form>
  </div>

{% endblock %}
