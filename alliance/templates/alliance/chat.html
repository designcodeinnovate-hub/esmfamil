<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>چت {{ alliance.name }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f0f1e 55%, #060608 100%);
      color: #e2e8f0;
      padding: 24px 20px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    a.back { color: #60a5fa; text-decoration: none; font-size: 14px; }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      margin: 14px 0 16px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 16px;
    }
    .chat-head .emblem { font-size: 38px; }
    .chat-head .info { flex: 1; }
    .chat-head .name { font-size: 18px; font-weight: bold; }
    .chat-head .sub { font-size: 12px; color: #64748b; font-family: monospace; }

    .chat-body {
      min-height: 380px;
      max-height: 60vh;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-body:empty::before {
      content: "💬 هنوز پیامی نیست. اولین نفر باش!";
      color: #64748b;
      text-align: center;
      font-size: 14px;
      margin: auto;
    }

    .msg {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .msg.me { flex-direction: row-reverse; }
    .msg .av {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(51, 65, 85, 0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .msg .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.me .bubble {
      background: linear-gradient(135deg, rgba(6,182,212,0.25), rgba(59,130,246,0.15));
      border-color: rgba(6,182,212,0.3);
    }
    .msg .sender { color: #fdba74; font-size: 12px; margin-bottom: 4px; font-weight: bold; }
    .msg .time { color: #64748b; font-size: 11px; margin-top: 4px; }

    .chat-input { display: flex; gap: 8px; }
    .chat-input input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
    }
    .chat-input input:focus { outline: none; border-color: #06b6d4; }
    .chat-input button {
      padding: 14px 22px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container">
  <a class="back" href="/alliance/{{ alliance.id }}/">← بازگشت به اتحاد</a>

  <div class="chat-head">
    <div class="emblem">{{ alliance.emblem }}</div>
    <div class="info">
      <div class="name">{{ alliance.name }}</div>
      <div class="sub">{{ alliance.invite_code }}</div>
    </div>
  </div>

  <div class="chat-body" id="chatBody">
    {% for m in messages %}
      <div class="msg {% if m.is_me %}me{% endif %}">
        <div class="av">{{ m.avatar }}</div>
        <div>
          {% if not m.is_me %}<div class="sender">{{ m.sender.alias }}</div>{% endif %}
          <div class="bubble">{{ m.body }}</div>
          <div class="time">{{ m.sent_at|date:"H:i" }}</div>
        </div>
      </div>
    {% endfor %}
  </div>

  <form method="post" class="chat-input">
    {% csrf_token %}
    <input type="text" name="body" maxlength="500" required placeholder="پیامت را بنویس..." autocomplete="off">
    <button type="submit">ارسال</button>
  </form>
</div>

<script>
  // اسکرول خودکار به پایین
  const body = document.getElementById("chatBody");
  body.scrollTop = body.scrollHeight;
</script>
</body>
</html>
