<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if ok %}تأیید شد{% else %}خطا{% endif %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f0f1e 55%, #060608 100%);
      color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 20px;
    }
    .box {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 40px 30px;
      border-radius: 20px;
      width: 440px;
      max-width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: popIn 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
    .icon { font-size: 88px; margin-bottom: 14px; }
    h1 { font-size: 22px; margin-bottom: 10px; }
    .ok h1 { color: #4ade80; }
    .fail h1 { color: #f87171; }
    p { color: #cbd5e1; line-height: 1.7; margin-bottom: 22px; }
    a.btn {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 12px;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
      font-size: 15px;
    }
    a.btn-ok {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 10px 26px rgba(34,197,94,0.4);
    }
    a.btn-fail {
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 10px 26px rgba(239,68,68,0.4);
    }
  </style>
</head>
<body>
  <div class="box">
    {% if ok %}
      <div class="ok">
        <div class="icon">✅</div>
        <h1>ایمیلت تأیید شد!</h1>
        <p>{{ message }}</p>
        <a class="btn btn-ok" href="/accounts/login/">ورود به حساب</a>
      </div>
    {% else %}
      <div class="fail">
        <div class="icon">⚠️</div>
        <h1>مشکلی پیش آمد</h1>
        <p>{{ message }}</p>
        <a class="btn btn-fail" href="/accounts/login/">صفحه ورود</a>
      </div>
    {% endif %}
  </div>
</body>
</html>
