<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت‌نام</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f0f1e 55%, #060608 100%);
      color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 20px;
    }
    .box {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 34px 28px;
      border-radius: 20px;
      width: 420px;
      max-width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 26px;
      background: linear-gradient(135deg, #f97316, #eab308);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
      text-align: center;
    }
    p.sub { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 22px; }
    label { display: block; color: #94a3b8; font-size: 13px; margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: #f97316; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #f97316, #eab308);
      box-shadow: 0 10px 26px rgba(249,115,22,0.4);
    }
    button:hover { transform: translateY(-2px); }
    .err {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .err ul { padding-right: 18px; margin: 4px 0; }
    .bottom-link {
      text-align: center;
      margin-top: 18px;
      color: #94a3b8;
      font-size: 13px;
    }
    .bottom-link a { color: #60a5fa; text-decoration: none; }
    .bottom-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="box">
    <h1>📝 ساخت حساب</h1>
    <p class="sub">با ایمیل و رمز، حساب خودت رو بساز</p>

    {% if errors %}
      <div class="err">
        <ul>
          {% for e in errors %}<li>{{ e }}</li>{% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label>ایمیل</label>
      <input type="email" name="email" value="{{ email }}" required autofocus
             placeholder="example@mail.com">

      <label>نام نمایشی</label>
      <input type="text" name="alias" value="{{ alias }}" maxlength="32" required
             placeholder="مثلاً: علی">

      <label>رمز عبور (حداقل ۸ کاراکتر)</label>
      <input type="password" name="password" minlength="8" required>

      <label>تکرار رمز عبور</label>
      <input type="password" name="password2" minlength="8" required>

      <button type="submit">ثبت‌نام</button>
    </form>

    <div class="bottom-link">
      حساب داری؟ <a href="/accounts/login/">وارد شو</a>
      &nbsp;|&nbsp;
      <a href="/">صفحه اصلی</a>
    </div>
  </div>
</body>
</html>
