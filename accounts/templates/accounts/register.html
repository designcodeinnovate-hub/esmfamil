<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a15">
  <title>ساخت اکانت کاربری</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 30% 10%, #1e1b4b 0%, #0f0f1e 45%, #060608 100%);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }
    .glow { position: fixed; width: 500px; height: 500px; border-radius: 50%; filter: blur(130px); opacity: 0.28; z-index: 0; pointer-events: none; }
    .glow-1 { top: -180px; right: -150px; background: #f4c542; }
    .glow-2 { bottom: -180px; left: -150px; background: #8b5cf6; }
    .box {
      position: relative;
      z-index: 10;
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 34px 28px;
      border-radius: 22px;
      width: 420px;
      max-width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 24px;
      text-align: center;
      background: linear-gradient(135deg, #f4c542, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    p.sub { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 22px; line-height: 1.6; }
    label { display: block; color: #cbd5e1; font-size: 13px; margin: 14px 0 6px; }

    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%;
      padding: 13px 42px 13px 16px;
      border-radius: 12px;
      border: 1.5px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input:focus { outline: none; }
    .input-wrap input:disabled { opacity: 0.5; cursor: not-allowed; }

    .input-wrap.checking input { border-color: rgba(244, 197, 66, 0.6); }
    .input-wrap.available input { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }
    .input-wrap.taken input,
    .input-wrap.error input { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      line-height: 1;
    }
    .input-wrap.available .input-icon.check { opacity: 1; color: #22c55e; font-weight: bold; }
    .input-wrap.taken .input-icon.cross,
    .input-wrap.error .input-icon.cross { opacity: 1; color: #ef4444; font-weight: bold; }
    .input-wrap.checking .input-icon.spinner {
      opacity: 1;
      color: #facc15;
      display: inline-block;
      animation: spin 1s linear infinite;
      transform-origin: center;
    }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    .input-wrap.has-eye input { padding-left: 44px; }
    .eye-toggle {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 6px;
      line-height: 1;
      transition: color 0.15s;
      border-radius: 6px;
    }
    .eye-toggle:hover { color: #f4c542; background: rgba(244,197,66,0.08); }
    .eye-toggle:active { transform: translateY(-50%) scale(0.92); }

    .hint { font-size: 11px; color: #64748b; margin-top: 5px; line-height: 1.5; }
    .status { font-size: 12px; margin-top: 6px; min-height: 18px; transition: color 0.2s; line-height: 1.5; }
    .status.ok { color: #22c55e; font-weight: bold; }
    .status.err { color: #ef4444; }
    .status.info { color: #94a3b8; }

    .error-global {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      margin-bottom: 8px;
      text-align: right;
      line-height: 1.6;
    }

    button[type=submit] {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      color: #1a1a1a;
      background: linear-gradient(135deg, #f4c542, #eab308);
      box-shadow: 0 10px 30px rgba(244,197,66,0.4);
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    }
    button[type=submit]:hover:not(:disabled) { transform: translateY(-2px); }
    button[type=submit]:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      background: #475569;
      color: #94a3b8;
    }

    .links { margin-top: 20px; text-align: center; font-size: 13px; color: #94a3b8; }
    .links a { color: #fdba74; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .divider { height: 1px; background: rgba(148,163,184,0.15); margin: 18px 0; }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="box">
    <h1>✍️ ساخت اکانت</h1>
    <p class="sub">فقط یه نام کاربری و رمز بساز و بریم!</p>
    {% if error %}<div class="error-global">{{ error }}</div>{% endif %}

    <form method="post" autocomplete="off" id="regForm" novalidate>
      {% csrf_token %}

      <label>شناسه کاربری</label>
      <div class="input-wrap" id="userWrap">
        <input
          type="text"
          name="username"
          id="usernameInput"
          maxlength="32"
          required
          autofocus
          value="{{ request.POST.username|default:'' }}"
          placeholder="مثلاً: ali_71"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          data-lpignore="true"
          data-1p-ignore="true"
          dir="ltr"
          style="text-align: left;">
        <span class="input-icon check">✓</span>
        <span class="input-icon cross">✕</span>
        <span class="input-icon spinner">⟳</span>
      </div>
      <div class="hint">فقط حروف انگلیسی، اعداد و _ — ۳ تا ۳۲ حرف</div>
      <div class="status info" id="usernameStatus"></div>

      <label>رمز عبور</label>
      <div class="input-wrap has-eye">
        <input
          type="password"
          name="password"
          id="passwordInput"
          required
          minlength="6"
          placeholder="حداقل ۶ حرف"
          autocomplete="new-password"
          data-lpignore="true"
          data-1p-ignore="true"
          disabled
          dir="ltr"
          style="text-align: left;">
        <button type="button" class="eye-toggle" onclick="togglePass('passwordInput', this)" tabindex="-1" aria-label="نمایش رمز">👁️</button>
      </div>

      <label>تکرار رمز</label>
      <div class="input-wrap has-eye">
        <input
          type="password"
          name="password2"
          id="password2Input"
          required
          minlength="6"
          placeholder="همون رمز رو دوباره بزن"
          autocomplete="new-password"
          data-lpignore="true"
          data-1p-ignore="true"
          disabled
          dir="ltr"
          style="text-align: left;">
        <button type="button" class="eye-toggle" onclick="togglePass('password2Input', this)" tabindex="-1" aria-label="نمایش رمز">👁️</button>
      </div>
      <div class="status" id="passwordStatus"></div>

      <button type="submit" id="submitBtn" disabled>🚀 ساخت اکانت</button>
    </form>

    <div class="divider"></div>
    <div class="links">
      قبلاً اکانت داری؟ <a href="/accounts/login/">وارد شو</a> | <a href="/">بازگشت</a>
    </div>
  </div>

  <script>
    const usernameInput  = document.getElementById('usernameInput');
    const passwordInput  = document.getElementById('passwordInput');
    const password2Input = document.getElementById('password2Input');
    const userWrap       = document.getElementById('userWrap');
    const usernameStatus = document.getElementById('usernameStatus');
    const passwordStatus = document.getElementById('passwordStatus');
    const submitBtn      = document.getElementById('submitBtn');

    let usernameOK = false;
    let checkTimer = null;
    let lastChecked = '';
    let autoFocusDone = false;

    // ============================================================
    // چک لحظه‌ای اسم کاربری
    // ============================================================
    function checkUsername() {
      const val = usernameInput.value.trim().toLowerCase();

      userWrap.classList.remove('checking', 'available', 'taken', 'error');
      usernameStatus.className = 'status';
      usernameStatus.textContent = '';

      if (!val) {
        usernameOK = false;
        lockPasswords(true);
        updateSubmit();
        return;
      }

      if (val.length < 3) {
        userWrap.classList.add('error');
        usernameStatus.className = 'status err';
        usernameStatus.textContent = 'شناسه باید حداقل ۳ حرف باشد.';
        usernameOK = false;
        lockPasswords(true);
        updateSubmit();
        return;
      }

      if (val.length > 32) {
        userWrap.classList.add('error');
        usernameStatus.className = 'status err';
        usernameStatus.textContent = 'شناسه نمی‌تواند بیشتر از ۳۲ حرف باشد.';
        usernameOK = false;
        lockPasswords(true);
        updateSubmit();
        return;
      }

      if (!/^[a-z0-9_]+$/.test(val)) {
        userWrap.classList.add('error');
        usernameStatus.className = 'status err';
        usernameStatus.textContent = 'فقط حروف انگلیسی، اعداد و _ مجاز است.';
        usernameOK = false;
        lockPasswords(true);
        updateSubmit();
        return;
      }

      if (val === lastChecked) return;

      userWrap.classList.add('checking');
      usernameStatus.className = 'status info';
      usernameStatus.textContent = 'در حال بررسی...';

      fetch('/accounts/check-username/?username=' + encodeURIComponent(val), {
        credentials: 'same-origin',
      })
        .then(r => r.json())
        .then(data => {
          userWrap.classList.remove('checking');

          // اگه کاربر تو این فاصله اسم رو عوض کرده، بی‌خیال شو
          if (usernameInput.value.trim().toLowerCase() !== val) return;

          lastChecked = val;

          if (data.available) {
            userWrap.classList.add('available');
            usernameStatus.className = 'status ok';
            usernameStatus.textContent = data.message || 'این شناسه آزاد است ✅';
            usernameOK = true;
            lockPasswords(false);

            // "برو سراغ رمز" — اگه کاربر هنوز روی فیلد اسمه
            if (!autoFocusDone && document.activeElement === usernameInput) {
              setTimeout(() => {
                if (document.activeElement === usernameInput) {
                  passwordInput.focus();
                }
              }, 200);
              autoFocusDone = true;
            }
          } else {
            userWrap.classList.add('taken');
            usernameStatus.className = 'status err';
            usernameStatus.textContent = data.message || 'این شناسه قبلاً گرفته شده.';
            usernameOK = false;
            lockPasswords(true);
            autoFocusDone = false;
          }
          updateSubmit();
        })
        .catch(() => {
          userWrap.classList.remove('checking');
          userWrap.classList.add('error');
          usernameStatus.className = 'status err';
          usernameStatus.textContent = 'خطا در بررسی. اتصال اینترنت رو چک کن.';
          usernameOK = false;
          lockPasswords(true);
          updateSubmit();
        });
    }

    function lockPasswords(lock) {
      passwordInput.disabled = lock;
      password2Input.disabled = lock;
      if (lock) {
        passwordInput.value = '';
        password2Input.value = '';
        passwordStatus.textContent = '';
        passwordStatus.className = 'status';
      }
    }

    // Debounce — 400ms بعد از تایپ
    usernameInput.addEventListener('input', () => {
      autoFocusDone = false;
      lastChecked = '';
      clearTimeout(checkTimer);
      checkTimer = setTimeout(checkUsername, 400);
    });

    // چک فوری وقتی از فیلد خارج شد
    usernameInput.addEventListener('blur', () => {
      clearTimeout(checkTimer);
      if (usernameInput.value.trim()) checkUsername();
    });

    // ============================================================
    // چک تطابق رمزها
    // ============================================================
    function checkPasswords() {
      const p1 = passwordInput.value;
      const p2 = password2Input.value;

      passwordStatus.className = 'status';
      passwordStatus.textContent = '';

      if (!p1) { updateSubmit(); return; }

      if (p1.length < 6) {
        passwordStatus.className = 'status err';
        passwordStatus.textContent = 'رمز باید حداقل ۶ حرف باشد.';
        updateSubmit();
        return;
      }

      if (p2 && p1 !== p2) {
        passwordStatus.className = 'status err';
        passwordStatus.textContent = 'دو رمز یکسان نیستند.';
        updateSubmit();
        return;
      }

      if (p2 && p1 === p2) {
        passwordStatus.className = 'status ok';
        passwordStatus.textContent = '✓ رمزها یکسان هستند';
      }

      updateSubmit();
    }

    passwordInput.addEventListener('input', checkPasswords);
    password2Input.addEventListener('input', checkPasswords);

    // ============================================================
    // وضعیت دکمه ثبت‌نام
    // ============================================================
    function updateSubmit() {
      const p1 = passwordInput.value;
      const p2 = password2Input.value;
      const valid = usernameOK && p1.length >= 6 && p1 === p2;
      submitBtn.disabled = !valid;
    }

    // ============================================================
    // نمایش / مخفی کردن رمز
    // ============================================================
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
        btn.setAttribute('aria-label', 'مخفی کردن رمز');
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
        btn.setAttribute('aria-label', 'نمایش رمز');
      }
    }

    // ============================================================
    // اگه صفحه با username پر رفرش شد (بعد از POST فیل)، دوباره چک کن
    // ============================================================
    if (usernameInput.value.trim()) {
      checkUsername();
    }

    // جلوگیری از submit بدون تأیید
    document.getElementById('regForm').addEventListener('submit', (e) => {
      if (!usernameOK) {
        e.preventDefault();
        usernameStatus.className = 'status err';
        usernameStatus.textContent = 'لطفاً یک شناسه کاربری معتبر انتخاب کن.';
        usernameInput.focus();
      }
    });
  </script>
</body>
</html>
