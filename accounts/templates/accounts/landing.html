<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a15">
  <title>اسم فامیل آنلاین</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    body {
      font-family: Tahoma, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1e1b4b 0%, #0f0f1e 45%, #060608 100%);
      color: #e2e8f0;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .glow {
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      filter: blur(130px);
      z-index: 0;
      pointer-events: none;
    }
    .glow-1 { top: -100px; right: -100px; background: #8b5cf6; opacity: 0.28; }
    .glow-2 { bottom: -100px; left: -100px; background: #f4c542; opacity: 0.18; }

    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .logo-wrap {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 10px;
    }
    .logo-crown {
      font-size: 46px;
      display: inline-block;
      transform: translateY(-10px) rotate(-8deg);
      filter: drop-shadow(0 6px 20px rgba(244,197,66,0.6));
    }
    .logo-name {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(180deg, #fde68a 0%, #f4c542 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
      margin: 0 8px;
      line-height: 1.05;
    }
    .tagline {
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: 1.5px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 340px;
      max-width: 90vw;
    }
    .btn-opt {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border: 1.5px solid;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      color: #e2e8f0;
    }
    .btn-opt:hover { transform: translateY(-3px); }
    .btn-opt .icon {
      font-size: 26px;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      flex-shrink: 0;
    }
    .btn-opt .label { flex: 1; text-align: right; }
    .btn-opt .arrow { color: inherit; opacity: 0.5; font-size: 18px; }

    .btn-register {
      background: linear-gradient(135deg, #f4c542, #eab308);
      color: #1a1a1a;
      border-color: transparent;
      padding: 20px 22px;
      font-size: 18px;
      box-shadow: 0 14px 40px rgba(244,197,66,0.45);
    }
    .btn-register .icon { background: rgba(0,0,0,0.15); font-size: 28px; width: 48px; height: 48px; }

    .btn-account {
      background: rgba(30, 41, 59, 0.75);
      border-color: rgba(6, 182, 212, 0.3);
    }
    .btn-account:hover { border-color: #06b6d4; background: rgba(30, 41, 59, 0.95); }

    .btn-guest {
      background: rgba(30, 41, 59, 0.6);
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.2);
    }
    .btn-guest:hover { border-color: #94a3b8; background: rgba(30, 41, 59, 0.85); }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
      color: #475569;
      font-size: 11px;
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(148, 163, 184, 0.15);
    }

    .footer {
      margin-top: 40px;
      margin-bottom: 30px;
      text-align: center;
      color: #475569;
      font-size: 11px;
      line-height: 1.8;
    }
    .footer .version { color: #64748b; font-family: monospace; }

    @media (max-width: 400px) {
      .logo-name { font-size: 40px; }
      .logo-crown { font-size: 36px; }
      .options { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="content">
    <div class="logo-wrap">
      <span class="logo-crown">👑</span>
      <span class="logo-name">اسم فامیل</span>
    </div>
    <div class="tagline">بازی نوستالژیک، حال و آنلاین</div>

    <div class="options">
      <a class="btn-opt btn-register" href="/accounts/register/">
        <span class="icon">✨</span>
        <span class="label">ساخت حساب جدید</span>
        <span class="arrow">←</span>
      </a>

      <div class="divider">یا</div>

      <a class="btn-opt btn-account" href="/accounts/login/">
        <span class="icon">🔐</span>
        <span class="label">ورود با حساب کاربری</span>
        <span class="arrow">←</span>
      </a>

      <a class="btn-opt btn-guest" href="/accounts/guest/">
        <span class="icon">🎲</span>
        <span class="label">ورود مهمان</span>
        <span class="arrow">←</span>
      </a>
    </div>

    <div class="footer">
      <div>اسم فامیل آنلاین</div>
      <div class="version">v3.0</div>
    </div>
  </div>
</body>
</html>
