<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>اسم فامیل آنلاین</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: linear-gradient(to bottom, #6cb8e8 0%, #a6d8ff 45%, #e6f4ff 100%);
      overflow: hidden;
      position: relative;
    }
    .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.85; filter: blur(0.5px); }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; background: white; border-radius: 50%;
    }
    .cloud1 { width: 130px; height: 55px; top: 8%;  left: -180px; animation: drift 50s linear infinite; }
    .cloud1::before { width: 80px; height: 80px; top: -35px; left: 20px; }
    .cloud1::after  { width: 60px; height: 60px; top: -15px; left: 70px; }
    .cloud2 { width: 170px; height: 65px; top: 28%; left: -220px; animation: drift 70s linear infinite; animation-delay: -25s; }
    .cloud2::before { width: 100px; height: 100px; top: -45px; left: 25px; }
    .cloud2::after  { width: 70px;  height: 70px;  top: -25px; left: 90px; }
    .cloud3 { width: 100px; height: 45px; top: 52%; left: -140px; animation: drift 55s linear infinite; animation-delay: -35s; }
    .cloud3::before { width: 65px; height: 65px; top: -28px; left: 12px; }
    .cloud3::after  { width: 50px; height: 50px; top: -12px; left: 52px; }
    .cloud4 { width: 150px; height: 60px; top: 72%; left: -200px; animation: drift 65s linear infinite; animation-delay: -45s; }
    .cloud4::before { width: 90px; height: 90px; top: -40px; left: 22px; }
    .cloud4::after  { width: 65px; height: 65px; top: -20px; left: 78px; }
    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw + 240px)); }
    }
    .content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .logo {
      font-size: 46px; font-weight: bold; color: #0f172a;
      text-shadow: 2px 2px 10px rgba(255,255,255,0.9);
      margin-bottom: 10px;
      animation: slideDown 0.8s ease-out;
    }
    .tagline {
      color: #334155; margin-bottom: 40px; font-size: 16px;
      animation: slideDown 0.95s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-70px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .options {
      display: flex; flex-direction: column; gap: 14px;
      width: 340px; max-width: 90vw;
    }
    .opt {
      background: white; border: none;
      padding: 18px 22px; border-radius: 18px;
      font-size: 18px; font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: space-between;
      opacity: 0; transform: translateY(-100px);
      animation: dropIn 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      transition: transform 0.15s, box-shadow 0.15s;
      color: #0f172a; text-decoration: none; width: 100%;
    }
    .opt:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 30px rgba(0,0,0,0.22);
    }
    .opt .icon { font-size: 28px; }
    .opt .label { flex: 1; text-align: right; margin-right: 12px; font-weight: bold; }
    .opt-email { animation-delay: 0.25s; border-right: 6px solid #3b82f6; }
    .opt-signup { animation-delay: 0.4s; border-right: 6px solid #8b5cf6; }
    .opt-phone { animation-delay: 0.55s; border-right: 6px solid #22c55e; }
    .opt-guest { animation-delay: 0.7s; border-right: 6px solid #f59e0b; }
    @keyframes dropIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .soon { font-size: 11px; color: #64748b; background: #f1f5f9; padding: 3px 8px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="cloud cloud4"></div>

  <div class="content">
    <div class="logo">🎮 اسم فامیل آنلاین</div>
    <div class="tagline">با دوستات بازی کن — بدون کاغذ و قلم!</div>

    <div class="options">
      <a class="opt opt-email" href="/accounts/login/">
        <span class="icon">📧</span>
        <span class="label">ورود با ایمیل</span>
      </a>
      <a class="opt opt-signup" href="/accounts/signup/">
        <span class="icon">📝</span>
        <span class="label">ثبت‌نام جدید</span>
      </a>
      <button class="opt opt-phone" type="button" onclick="alert('ورود با شماره موبایل به زودی!')">
        <span class="icon">📱</span>
        <span class="label">ورود با شماره موبایل</span>
        <span class="soon">به‌زودی</span>
      </button>
      <a class="opt opt-guest" href="/accounts/guest/start/">
        <span class="icon">🎲</span>
        <span class="label">ورود سریع (مهمان)</span>
      </a>
    </div>
  </div>
</body>
</html>
