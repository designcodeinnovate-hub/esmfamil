<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <title>اسم فامیل آنلاین</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-y: auto; overflow-x: hidden; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background-color: #0b0f19;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: 100dvh;
      direction: rtl;
      position: relative;
    }

    /* ===== 3D FLOATING SPHERES BACKGROUND ===== */
    .spheres-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4a3b6b, #1d1734 60%, #0d0a1a);
      box-shadow: inset -15px -15px 30px rgba(0,0,0,0.8), inset 10px 10px 20px rgba(255,255,255,0.05);
      animation: floatSphere 10s ease-in-out infinite;
    }
    .sphere-1 { top: -5%; left: -5%; width: 250px; height: 250px; animation-delay: 0s; }
    .sphere-2 { top: 15%; right: -10%; width: 200px; height: 200px; animation-delay: -2s; }
    .sphere-3 { bottom: 10%; left: 10%; width: 150px; height: 150px; animation-delay: -4s; }
    .sphere-4 { bottom: -5%; right: -5%; width: 300px; height: 300px; animation-delay: -6s; }
    
    @keyframes floatSphere {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.02); }
    }

    /* ===== CONTENT ===== */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 30px;
      min-height: 100vh;
      min-height: 100dvh;
      justify-content: center;
    }

    /* ===== LOGO SECTION ===== */
    .logo-container {
      position: relative;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: logoFloat 5s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .crown-svg {
      width: 60px;
      height: 60px;
      position: absolute;
      top: -35px;
      right: 15px;
      transform: rotate(15deg);
      filter: drop-shadow(0 5px 15px rgba(244, 197, 66, 0.6));
      z-index: 2;
      animation: crownBob 3s ease-in-out infinite;
    }
    @keyframes crownBob {
      0%, 100% { transform: rotate(15deg) translateY(0); }
      50% { transform: rotate(15deg) translateY(-4px); }
    }

    .logo-text {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      font-size: 68px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -2px;
      line-height: 1;
      position: relative;
      /* Mimicking the thick dark purple outline and shadow from your image */
      -webkit-text-stroke: 3px #1e1333;
      text-shadow: 
        5px 5px 0px #1e1333, 
        -2px -2px 0px #1e1333, 
        2px -2px 0px #1e1333, 
        -2px 2px 0px #1e1333, 
        2px 2px 0px #1e1333,
        0px 15px 25px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-text span {
      position: relative;
      z-index: 1;
    }

    .tagline {
      color: #cbd5e1;
      font-size: 14px;
      text-align: center;
      margin-top: 25px;
      margin-bottom: 50px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ===== BUTTONS ===== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 340px;
      max-width: 90vw;
    }

    .btn-opt {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
      border: 2px solid;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      color: #e2e8f0;
      font-family: inherit;
      overflow: hidden;
    }
    .btn-opt::before {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: skewX(-20deg);
      transition: left 0.5s;
    }
    .btn-opt:hover::before { left: 200%; }
    .btn-opt:hover { transform: translateY(-3px); }
    .btn-opt:active { transform: scale(0.97); }

    .btn-opt .icon {
      font-size: 24px;
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(15, 23, 42, 0.4);
      border-radius: 12px;
      flex-shrink: 0;
    }
    .btn-opt .label { flex: 1; text-align: right; }
    .btn-opt .arrow { color: inherit; opacity: 0.6; font-size: 18px; }

    /* Register (Gold) */
    .btn-register {
      background: linear-gradient(135deg, #f5c451, #d4a017);
      color: #1a1a1a;
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(244, 197, 66, 0.3);
    }
    .btn-register:hover { box-shadow: 0 15px 40px rgba(244, 197, 66, 0.5); }
    .btn-register .icon { background: rgba(255, 255, 255, 0.2); }

    /* Account (Cyan/Teal) */
    .btn-account {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(6, 182, 212, 0.4);
      backdrop-filter: blur(10px);
    }
    .btn-account:hover {
      border-color: #06b6d4;
      background: rgba(30, 41, 59, 0.95);
    }

    /* Guest (Muted) */
    .btn-guest {
      background: rgba(30, 41, 59, 0.6);
      color: #cbd5e1;
      border-color: rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(10px);
    }
    .btn-guest:hover {
      border-color: #94a3b8;
      background: rgba(30, 41, 59, 0.85);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 2px 0;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(148, 163, 184, 0.2);
    }

    @media (max-width: 400px) {
      .logo-text { font-size: 52px; }
      .crown-svg { width: 45px; height: 45px; top: -25px; right: 10px; }
      .options { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- 3D Floating Spheres Background -->
  <div class="spheres-container">
    <div class="sphere sphere-1"></div>
    <div class="sphere sphere-2"></div>
    <div class="sphere sphere-3"></div>
    <div class="sphere sphere-4"></div>
  </div>

  <div class="content">
    
    <!-- Logo Section Built with Code -->
    <div class="logo-container">
      <!-- Custom Crown SVG -->
      <svg class="crown-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 70 L10 30 L35 45 L50 15 L65 45 L90 30 L85 70 Z" fill="#f5c451" stroke="#d4a017" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="10" cy="25" r="6" fill="#f5c451" stroke="#d4a017" stroke-width="3"/>
        <circle cx="50" cy="10" r="6" fill="#f5c451" stroke="#d4a017" stroke-width="3"/>
        <circle cx="90" cy="25" r="6" fill="#f5c451" stroke="#d4a017" stroke-width="3"/>
        <rect x="15" y="70" width="70" height="15" fill="#f5c451" stroke="#d4a017" stroke-width="4" rx="4"/>
      </svg>

      <!-- Custom CSS Text Logo -->
      <div class="logo-text">
        <span>اسم</span>
        <span>فامیل</span>
      </div>
    </div>

    <div class="tagline">بازی آنلاین، دورهمی بدون مرز</div>

    <div class="options">
      <a class="btn-opt btn-register" href="/accounts/register/">
        <span class="icon">✨</span>
        <span class="label">ساخت حساب جدید</span>
        <span class="arrow">←</span>
      </a>

      <div class="divider">یا</div>

      <a class="btn-opt btn-account" href="/accounts/login/">
        <span class="icon">🔐</span>
        <span class="label">ورود با حساب کاربری</span>
        <span class="arrow">←</span>
      </a>

      <a class="btn-opt btn-guest" href="/accounts/guest/">
        <span class="icon">🎲</span>
        <span class="label">ورود مهمان</span>
        <span class="arrow">←</span>
      </a>
    </div>

  </div>
</body>
</html>
