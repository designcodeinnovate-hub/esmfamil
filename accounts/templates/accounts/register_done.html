<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ایمیل تأیید</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f0f1e 55%, #060608 100%);
      color: #e2e8f0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 20px;
    }
    .box {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      padding: 34px 28px;
      border-radius: 20px;
      width: 480px;
      max-width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 80px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      color: #facc15;
      margin-bottom: 10px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.7;
      font-size: 14px;
    }
    .email {
      color: #fdba74;
      font-weight: bold;
      font-family: monospace;
    }
    .debug-box {
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      text-align: center;
    }
    .debug-box h3 {
      color: #facc15;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .debug-box p { color: #fde68a; font-size: 12px; margin-bottom: 12px; }
    a.verify-btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 10px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 8px 22px rgba(34,197,94,0.4);
    }
    a.verify-btn:hover { transform: translateY(-2px); }
    a.back-btn {
      display: inline-block;
      margin-top: 18px;
      color: #60a5fa;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📧</div>
    <h1>یک ایمیل تأیید برایت فرستادیم</h1>
    <p>
      به آدرس <span class="email">{{ email }}</span> یک ایمیل فرستادیم.<br>
      روی لینک داخل ایمیل کلیک کن تا حسابت فعال شود.
    </p>

    {% if debug %}
      <div class="debug-box">
        <h3>⚙️ حالت توسعه (DEBUG)</h3>
        <p>چون ایمیل واقعی نمی‌فرستیم، لینک تأیید مستقیم اینجاست:</p>
        <a class="verify-btn" href="/accounts/verify/?token={{ verify_token }}">✅ تأیید ایمیل حالا</a>
      </div>
    {% endif %}

    <a class="back-btn" href="/accounts/login/">← بازگشت به صفحه ورود</a>
  </div>
</body>
</html>
