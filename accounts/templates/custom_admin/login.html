<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود ادمین</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1a0a2e 0%, #0a0a15 60%, #000 100%);
      color: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
      padding: 20px;
    }
    .box {
      background: rgba(30, 20, 50, 0.9);
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 34px 28px;
      border-radius: 20px;
      width: 380px; max-width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: 22px; text-align: center;
      background: linear-gradient(135deg, #ef4444, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    p.sub { color: #94a3b8; font-size: 12px; text-align: center; margin-bottom: 22px; }

    label { display: block; color: #cbd5e1; font-size: 13px; margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid rgba(148, 163, 184, 0.2);
      background: rgba(10, 10, 21, 0.7);
      color: #fff;
      font-size: 15px;
      font-family: monospace;
    }
    input:focus { outline: none; border-color: #ef4444; }

    button {
      width: 100%; margin-top: 22px; padding: 14px;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: bold;
      font-family: inherit; cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 10px 30px rgba(239,68,68,0.4);
    }
    button:hover { transform: translateY(-2px); }

    .error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 10px;
      text-align: center;
    }
    .warn {
      color: #f59e0b;
      font-size: 11px;
      text-align: center;
      margin-top: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔒 پنل مدیریت</h1>
    <p class="sub">ورود محدود به مدیر سیستم</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post">
      {% csrf_token %}
      <label>نام کاربری ادمین</label>
      <input type="text" name="username" required autofocus
             value="{{ request.POST.username|default:'' }}"
             autocomplete="off">

      <label>رمز عبور</label>
      <input type="password" name="password" required
             autocomplete="off">

      <button type="submit">🔓 ورود به پنل</button>
    </form>

    <p class="warn">
      ⚠️ این صفحه فقط برای مدیر است. تمام ورودها ثبت می‌شوند.
    </p>
  </div>
</body>
</html>
