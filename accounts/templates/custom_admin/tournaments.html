<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>چالش — پنل ادمین</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: Tahoma, sans-serif;
        background-color: #0f111a;
        color: #e2e8f0;
        min-height: 100vh;
        padding-right: 70px; /* Space for the right rail */
    }

    /* ===== FIXED RIGHT RAIL ===== */
    .admin-rail {
        position: fixed;
        top: 0;
        right: 0;
        width: 70px;
        height: 100vh;
        background-color: #161925;
        border-left: 1px solid #232838;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
        z-index: 1000;
        gap: 12px;
    }
    
    .rail-logo {
        color: #8b5cf6;
        margin-bottom: 10px;
    }

    .rail-item {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        text-decoration: none;
        transition: all 0.2s;
        position: relative;
    }

    .rail-item:hover {
        color: #a78bfa;
        background-color: rgba(139, 92, 246, 0.1);
    }

    .rail-item.active {
        color: #8b5cf6;
        background-color: rgba(139, 92, 246, 0.15);
    }

    .rail-item::after {
        content: attr(title);
        position: absolute;
        right: 60px;
        background: #1e2230;
        color: #fff;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        border: 1px solid #2d3748;
        z-index: 1001;
    }

    .rail-item:hover::after { opacity: 1; }

    .rail-logout {
        margin-top: auto;
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ef4444;
        text-decoration: none;
        transition: 0.2s;
    }
    .rail-logout:hover { background-color: rgba(239, 68, 68, 0.1); }

    /* ===== MAIN CONTENT ===== */
    .admin-content {
        padding: 30px 20px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .page-title {
        font-size: 24px;
        font-weight: 900;
        color: #fff;
        margin-bottom: 24px;
    }

    /* ===== CARDS & STATS ===== */
    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 24px;
    }
    .stat {
        background: #161925;
        border: 1px solid #232838;
        border-radius: 16px;
        padding: 20px;
    }
    .stat .label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .stat .value { font-size: 26px; font-weight: bold; color: #8b5cf6; font-family: monospace; }

    .card {
        background: #161925;
        border: 1px solid #232838;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 24px;
    }

    /* ===== TABLES ===== */
    .table-wrap {
        background: #161925;
        border: 1px solid #232838;
        border-radius: 16px;
        overflow: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th {
        background: #1a1e2f;
        padding: 16px 12px;
        text-align: right;
        font-size: 12px;
        color: #94a3b8;
        border-bottom: 1px solid #232838;
    }
    td {
        padding: 14px 12px;
        text-align: right;
        font-size: 13px;
        border-bottom: 1px solid #232838;
        color: #e2e8f0;
    }
    tr:hover td { background: #1a1e2f; }

    /* ===== BADGES & BUTTONS ===== */
    .username { font-family: monospace; font-weight: bold; color: #8b5cf6; }
    .level-badge { background: rgba(139, 92, 246, 0.15); color: #a78bfa; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; }
    .status { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: bold; }
    .status.on { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .status.off { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .status.staff { background: rgba(234, 179, 8, 0.15); color: #fde68a; }
    
    .avatar-mini {
        width: 36px; height: 36px;
        display: inline-flex; align-items: center; justify-content: center;
        background: #232838; border-radius: 50%; overflow: hidden; font-size: 20px;
    }
    .avatar-mini img { width: 100%; height: 100%; object-fit: cover; }

    .btn-search {
        padding: 12px 20px;
        background: #8b5cf6; color: #fff;
        border: none; border-radius: 10px;
        font-family: inherit; font-weight: bold; cursor: pointer;
    }
    
    /* ===== SEARCH ===== */
    .search-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-row input {
        flex: 1; padding: 12px 16px;
        background: #161925; border: 1px solid #232838;
        border-radius: 12px; color: #fff;
        font-family: inherit; font-size: 14px;
    }
    .search-row input:focus { outline: none; border-color: #8b5cf6; }
    
    /* ===== LIVE CARDS ===== */
    .live-header {
        background: linear-gradient(135deg, rgba(34,197,94,0.1), rgba(6,182,212,0.05));
        border: 1px solid rgba(34,197,94,0.3);
        border-radius: 16px; padding: 20px;
        display: flex; align-items: center; gap: 16px;
        margin-bottom: 24px;
    }
    .live-dot { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .live-title { font-size: 18px; font-weight: 900; color: #4ade80; }
    .live-sub { font-size: 12px; color: #86efac; }
    
    .live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .live-card { background: #161925; border: 1px solid #232838; border-radius: 16px; padding: 16px; }
    .lc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .lc-icon { width: 44px; height: 44px; border-radius: 12px; background: #232838; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .lc-title { font-size: 15px; font-weight: bold; color: #fff; }
    .lc-code { font-size: 11px; color: #8b5cf6; background: rgba(139,92,246,0.1); padding: 2px 8px; border-radius: 6px; }
    
    .players-live { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: #0f111a; border-radius: 10px; margin-bottom: 12px; }
    .player-chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: #1a1e2f; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .pc-av { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; background: #232838; display: flex; align-items: center; justify-content: center; }
    .pc-av img { width: 100%; height: 100%; object-fit: cover; }
    .pc-score { color: #4ade80; font-family: monospace; }

    .live-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .ls-item { padding: 8px; background: #0f111a; border-radius: 8px; text-align: center; }
    .ls-item .l { font-size: 10px; color: #64748b; }
    .ls-item .v { font-size: 14px; font-weight: bold; color: #fff; }
    
    .letter-box { display: flex; align-items: center; gap: 10px; padding: 10px; background: #0f111a; border-radius: 10px; margin-bottom: 12px; }
    .lr-letter { width: 40px; height: 40px; border-radius: 10px; background: #232838; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; }
    
    /* ===== TICKETS ===== */
    .stats-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-chip { flex: 1; min-width: 100px; padding: 12px; border-radius: 12px; background: #161925; border: 1px solid #232838; text-align: center; }
    .stat-chip .l { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .stat-chip .v { font-size: 20px; font-weight: bold; color: #fff; }
    
    .ticket-row { display: flex; align-items: center; gap: 14px; padding: 14px; background: #161925; border: 1px solid #232838; border-radius: 12px; margin-bottom: 10px; text-decoration: none; color: inherit; }
    .ticket-row:hover { border-color: #8b5cf6; }
    .ticket-row .av { width: 40px; height: 40px; border-radius: 50%; background: #232838; display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; }
    .ticket-row .av img { width: 100%; height: 100%; object-fit: cover; }
    .ticket-row .title { font-size: 14px; font-weight: bold; color: #fff; }
    .ticket-row .meta { font-size: 11px; color: #94a3b8; }
    .badge { font-size: 10px; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
    .badge-open { background: rgba(234,179,8,0.15); color: #fde68a; }
    .badge-answered { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-closed { background: rgba(100,116,139,0.15); color: #cbd5e1; }
    .badge-in_progress { background: rgba(59,130,246,0.15); color: #93c5fd; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f111a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    /* Notification Dot for Support */
    .rail-item { position: relative; }
    .notif-dot {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 10px;
        height: 10px;
        background-color: #ef4444;
        border-radius: 50%;
        border: 2px solid #161925;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
        animation: pulseDot 1.5s infinite;
    }
    @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.2); opacity: 0.7; }
    }


    /* ============================================================
       LAYOUT MASTER FIX - Do not remove
       ============================================================ */
       
    /* 1. Force Body to have proper padding for the rail */
    body {
        padding-right: 85px !important; /* Space for the rail + gap */
        padding-left: 0 !important;
        margin: 0 !important;
        overflow-x: hidden !important;
    }

    /* 2. Force the Rail to be strictly fixed, full height, and on top */
    .admin-rail {
        position: fixed !important;
        top: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        height: 100vh !important;
        width: 70px !important;
        margin: 0 !important;
        z-index: 9999 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        padding: 20px 0 !important;
        box-sizing: border-box !important;
    }

    /* 3. Force the Content to be perfectly centered and spaced */
    .admin-content {
        width: 100% !important;
        max-width: 1200px !important;
        margin: 0 auto !important;
        padding: 30px 20px !important;
        box-sizing: border-box !important;
        position: relative !important;
        z-index: 1 !important;
    }

    /* 4. Table alignment */
    .table-wrap {
        width: 100% !important;
        box-sizing: border-box !important;
    }
    table {
        width: 100% !important;
        min-width: 100% !important; /* Force table to fill container */
    }
    th, td {
        text-align: right !important;
    }
    
    /* 5. Ensure no old styles break the layout */
    body.menu-open {
        padding-right: 85px !important;
    }

</style>
</head>
<body><div class="admin-rail">

</div>
<div class="admin-content">
  <h1 class="page-title">مدیریت چالش</h1>
  <div class="card">
    <h3 style="margin-bottom:16px;color:#fff;">چالش ({{ tournaments|length }})</h3>
    {% for t in tournaments %}
      <div style="padding:12px;background:#0f111a;border-radius:8px;margin-bottom:8px;border:1px solid #232838;">
        <div style="font-weight:bold;color:#fff;">{{ t.icon }} {{ t.name }}</div>
        <div style="font-size:11px;color:#94a3b8;">{{ t.status_display }} · {{ t.entry_count }} شرکت‌کننده</div>
      </div>
    {% empty %}
      <div style="text-align:center;color:#64748b;padding:20px;">تورنمنتی نیست</div>
    {% endfor %}
  </div>
</div>
</body></html>
